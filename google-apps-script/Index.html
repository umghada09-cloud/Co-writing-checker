<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ghada’s Finals Tracker</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="st">:root{
/* layout: summary header → tabs → one working view; subject colour carries identity, form carries status */
--bg:#F3F5F9;--surface:#FFFFFF;--ink:#18202E;--muted:#5D6779;--line:#DFE4EC;--accent:#0B6E79;
--ok:#15803D;--bad:#D92D20;--mu:#2563EB;--late:#B54708;
--old:#7C5CFA;--new:#0EA5A4;--study:#6366F1;--practice:#F59E0B;--catch:#94A3B8;
--display:'Bricolage Grotesque','IBM Plex Sans Arabic',system-ui,sans-serif;
--body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141C;--surface:#18202B;--ink:#E8EDF4;--muted:#9AA6B8;--line:#2A3442;--accent:#3FC1CD;--ok:#4ADE80;--bad:#F87171;--mu:#7AA7FF;--late:#F5A35C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F141C;--surface:#18202B;--ink:#E8EDF4;--muted:#9AA6B8;--line:#2A3442;--accent:#3FC1CD;--ok:#4ADE80;--bad:#F87171;--mu:#7AA7FF;--late:#F5A35C;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
#root{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px}
h3{font-size:16px;margin:22px 0 10px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.top{display:grid;grid-template-columns:1fr;gap:16px}
.phasebar{display:flex;gap:4px;margin-top:14px;font-size:12px}
.ph{border-radius:8px;padding:6px 8px;background:color-mix(in srgb,var(--c,#888) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c,#888) 35%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph b{color:var(--c)}
.ph.on{box-shadow:0 0 0 2px var(--c)}
.ph-study{--c:var(--study)}.ph-final{--c:#E11D48}.k-final{color:#E11D48;font-weight:600}.ph-old{--c:var(--old)}.ph-new{--c:var(--new)}.ph-practice{--c:var(--practice)}.ph-catch{--c:var(--catch)}.ph-exam{--c:var(--bad)}
.kpis{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:150px;justify-content:center;display:flex;flex-direction:column}
.kpi b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.warn b{color:var(--bad)}.kpi.exam b{color:var(--accent)}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative;align-content:center}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
.ring span,.ring small{position:relative;line-height:1}
.ring span{font-family:var(--display);font-weight:800;font-size:18px}
.ring small{font-size:10px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin:22px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-color:var(--accent)}
.tabs a:hover{color:var(--ink)}
.cnt{font-style:normal;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
.save{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.lede{color:var(--muted);max-width:70ch;margin:0 0 16px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0}
/* day */
.dayhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dayhead>div{flex:1;min-width:200px}
.sub{color:var(--muted);font-size:13.5px}
.ph-tag{display:inline-block;border-radius:99px;padding:1px 9px;font-weight:600;font-size:12.5px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.nav{font-size:22px;line-height:1;padding:4px 12px}
.jump{font-size:12px;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
#jump{width:auto}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{display:grid;grid-template-columns:86px 1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--c);border-radius:12px;padding:10px 12px}
.task.st-done,.task.st-madeup{background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.task.st-done .tt,.task.st-madeup .tt{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);color:var(--muted)}
.task.st-missed{background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.tm{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.sb{color:var(--c);font-weight:700}
.kind{color:var(--muted)}
.from{color:var(--muted)}
.tt{font-size:16px;font-weight:600;margin-top:2px}
.why{font-size:12.5px;color:var(--bad);margin-top:3px}
.act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.b{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13.5px}
.b:hover{border-color:var(--ink)}
.b:disabled{opacity:.35;cursor:default}
.b.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.b.no{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.b.ghost{background:transparent}
.pill{display:inline-block;border-radius:99px;padding:0 8px;font-size:11.5px;font-weight:700;line-height:19px}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.mu{background:color-mix(in srgb,var(--mu) 16%,transparent);color:var(--mu)}
.pill.late{background:color-mix(in srgb,var(--late) 16%,transparent);color:var(--late)}
.pill.now{background:var(--accent);color:var(--surface);vertical-align:middle;font-family:var(--body)}
.nd{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:8px;padding-top:10px;display:grid;gap:10px}
.nd fieldset{border:0;padding:0;margin:0}
.nd legend{font-weight:700;font-size:13.5px;margin-bottom:6px}
.nd legend.err{color:var(--bad)}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.rc input{position:absolute;opacity:0;width:1px;height:1px}
.rc span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.rc input:checked+span{background:var(--bad);border-color:var(--bad);color:#fff}
.rc input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.frow{display:grid;gap:4px}
.frow label,.ecard>label{font-size:12.5px;font-weight:600;color:var(--muted)}
.frow.two{grid-template-columns:1fr 1fr;gap:10px}
.frow.btns{display:flex;gap:8px;align-items:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);margin-top:16px}
.empty.exam{border-color:var(--bad);color:var(--ink)}
/* calendar */
.cal{overflow-x:auto}
.cw,.grid{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));gap:5px;min-width:620px}
.cw span{font-size:12px;font-weight:700;color:var(--muted);padding:0 4px}
.grid{margin-top:4px}
.cell{text-align:start;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--line));border-radius:10px;min-height:84px;padding:6px;display:flex;flex-direction:column;gap:5px;color:var(--ink)}
.cell.out{opacity:.35;border-top-color:var(--line)}
.cell.now{box-shadow:0 0 0 2px var(--accent)}
.cell.sel{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.cell.ph-exam{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.dn{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ex{font-size:11px;font-weight:800;color:var(--bad);letter-spacing:.06em}
.bars{display:flex;flex-wrap:wrap;gap:3px}
.bar{display:block;width:14px;height:8px;border-radius:3px;border:1.5px solid var(--c);background:transparent}
.bar.s-done,.bar.s-madeup{background:var(--c)}
.bar.s-missed{border-color:var(--bad);background:repeating-linear-gradient(45deg,var(--bad) 0 2px,transparent 2px 4px)}
.bar.late{border-style:dashed}
.mkn{font-size:10.5px;color:var(--mu);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:13px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);margin-inline-end:6px;vertical-align:-1px}
/* subjects */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{margin:0;color:var(--c)}
.ar{font-size:13px;color:var(--muted)}
.big{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.big small{display:block;font-family:var(--body);font-size:12.5px;font-weight:500;color:var(--muted);margin-top:4px}
.big em{color:var(--bad);font-style:normal}
.seg{display:grid;grid-template-columns:60px 1fr 40px;gap:8px;align-items:center;font-size:12.5px}
.seg b{text-align:end;font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.track i{display:block;height:100%;background:var(--c,var(--ok))}
.track i.m{background:var(--bad)}
details summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--accent)}
details ol{margin:8px 0 0;padding-inline-start:20px;display:grid;gap:5px;font-size:13.5px}
details li small{display:block;color:var(--muted);font-size:11.5px}
.li-done span,.li-madeup span{text-decoration:line-through;color:var(--muted)}
.note{font-size:12.5px;color:var(--late);margin:0;border-top:1px dashed var(--line);padding-top:8px}
/* memo */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.mcard{display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;--c:#0E8F6E}
.mcard.full{border-color:var(--c)}
.mn{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.mcard h3{margin:0;font-size:17px}
.mb{display:grid;gap:6px}
.dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--c)}
.dot.s-done,.dot.s-madeup{background:var(--c)}
.dot.s-missed{border-color:var(--bad);background:var(--bad)}
.dots small{color:var(--muted);font-size:12px;margin-inline-start:4px}
.vis{font-size:12px;color:var(--muted);font-weight:600}
/* makeup */
.mkcols{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.mkcols h3:first-child{margin-top:0}
.why-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.rb{display:grid;grid-template-columns:1fr 90px 22px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.rb .track i{background:var(--bad)}
.flag{background:color-mix(in srgb,var(--late) 12%,transparent);color:var(--late);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600}
/* edit */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:14px}
.ecard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:12px;display:grid;gap:6px;margin:0}
.ecard legend{font-weight:800;font-family:var(--display);padding:0 4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-inline-end:6px}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:12px 0;margin-top:12px;border-top:1px solid var(--line)}
#stu{max-width:280px}
@media (max-width:820px){.top{grid-template-columns:1fr}.kpis{justify-content:flex-start}.mkcols{grid-template-columns:1fr}}
@media (max-width:560px){
 .task{grid-template-columns:1fr}.tm{order:-1}.act{justify-content:flex-start}
 .phasebar{flex-wrap:wrap}.ph{flex:1 1 45%!important}
 .frow.two{grid-template-columns:1fr}
 .kpi{min-width:0;flex:1 1 40%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:16px}
.sp{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:10px;padding:8px 10px;color:var(--ink);text-decoration:none}
.sp:hover{border-color:var(--c)}
.spn{font-weight:700;color:var(--c);font-size:13.5px}
.sp b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.sbar{grid-column:1/-1;display:flex;gap:2px;height:8px}
.sg{display:block;background:color-mix(in srgb,var(--c) 18%,var(--line));border-radius:3px;overflow:hidden;min-width:4px}
.sg i{display:block;height:100%;background:var(--c)}
.sg.k-new i{background:color-mix(in srgb,var(--c) 70%,#000)}
.sg.k-practice i{background:repeating-linear-gradient(45deg,var(--c) 0 3px,color-mix(in srgb,var(--c) 60%,#fff) 3px 6px)}
.sp small{grid-column:1/-1;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sp em{color:var(--bad);font-style:normal}
.k-old{color:var(--old);font-weight:600}.k-new{color:var(--new);font-weight:600}.k-practice{color:var(--late);font-weight:600}

.school{margin-top:14px;background:repeating-linear-gradient(135deg,var(--surface) 0 10px,color-mix(in srgb,var(--muted) 8%,var(--surface)) 10px 20px);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.school span{color:var(--muted)}

#root{position:relative}
.topright{position:absolute;top:18px;inset-inline-end:18px;display:flex;gap:10px;align-items:center;z-index:5}
.motd{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:linear-gradient(145deg,#FFB020,#FF6B6B);color:#fff;border-radius:16px;padding:8px 12px;font-weight:700;font-size:11px;box-shadow:0 6px 16px rgba(255,107,107,.35)}
.motd:hover{transform:translateY(-1px)}
.motd.new::after{content:"";position:absolute;top:-4px;inset-inline-end:-4px;width:14px;height:14px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.motd.new svg{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.mo-back{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20}
.mo{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));background:var(--surface);border-radius:20px;padding:20px 22px 16px;border-top:8px solid #FFB020;box-shadow:0 20px 50px rgba(0,0,0,.25);display:grid;gap:10px}
.mo-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mo h2{font-size:24px;line-height:1.3}
.mo-ar{font-size:20px;font-weight:600;color:var(--accent);margin:0}
.brand{padding-inline-end:260px}

.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);padding:7px 11px;font-weight:700;font-size:13px}
.lang button.on{background:var(--accent);color:var(--surface)}
.chooser{min-height:70vh;display:grid;place-content:center;text-align:center;gap:10px}
.chs{display:flex;gap:14px;justify-content:center;margin-top:12px}
.b.big{font-size:20px;padding:16px 32px;border-radius:14px;border:2px solid var(--accent);color:var(--accent)}
.b.big:hover{background:var(--accent);color:var(--surface)}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:var(--body)}
html[dir="rtl"] .eyebrow{letter-spacing:0}
@media (max-width:640px){.topright{position:static;justify-content:flex-end;margin-bottom:10px}.brand{padding-inline-end:0}}

.examday{margin-top:14px;border-radius:14px;padding:14px 16px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:2px solid var(--c);display:grid;gap:4px;font-size:15px}
.examday b{color:var(--c);font-size:18px}
.examday span{color:var(--muted);font-size:13.5px}
.cell.ph-final{border-top-color:#E11D48}
#timerbar{display:none}
#timerbar.on{display:block;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:3px solid var(--c);box-shadow:0 -8px 24px rgba(0,0,0,.14)}
.tb-prog{position:absolute;top:-3px;inset-inline-start:0;height:3px;background:var(--ink);opacity:.35}
.tb-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tb-info{flex:1;min-width:180px;display:grid}
.tb-s{font-size:12px;color:var(--c);font-weight:700}
.tb-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-clock{font-family:var(--display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c);min-width:110px;text-align:center}
#timerbar.fin .tb-clock{color:var(--ok);font-size:22px}
.tb-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb-msg{font-size:13px;color:var(--muted)}
.b.tmr{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));font-variant-numeric:tabular-nums}
.b.tmr.run{background:var(--accent);color:var(--surface)}
body:has(#timerbar.on) #root{padding-bottom:120px}

.vstrip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-top:18px;align-items:stretch}
.vp{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px 8px;text-align:center;min-width:0}
.vp:hover{border-color:var(--c)}
.vpc{font-family:var(--display);font-size:20px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
.tube{position:relative;display:block;width:34px;height:150px;border-radius:17px;background:color-mix(in srgb,var(--c) 14%,var(--bg));border:2px solid color-mix(in srgb,var(--c) 45%,transparent);overflow:hidden}
.fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--c),color-mix(in srgb,var(--c) 70%,#fff));transition:height .8s cubic-bezier(.2,.8,.2,1)}
.vp.full .tube{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.vt{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed color-mix(in srgb,var(--ink) 35%,transparent)}
.vpn{font-weight:700;font-size:13px;color:var(--c);line-height:1.25;overflow-wrap:anywhere}

}
function vEdit(){
  var h='<section><p class="lede">'+L('Rename a subject or change its lesson list (one lesson per line). Saving re-plans all sessions not yet marked, starting tomorrow. Done and missed sessions stay as they are.','غيّري اسم المادة أو قائمة دروسها (درس في كل سطر). عند الحفظ يُعاد توزيع الجلسات غير المحددة بدءًا من الغد، وتبقى الجلسات المنجزة والفائتة كما هي.')+'</p>'+
    '<form id="edit"><div class="frow"><label for="stu">'+L('Student name','اسم الطالبة')+'</label><input id="stu" name="stu" value="'+esc(state.student)+'"></div><div class="egrid">';
  state.subjects.forEach(function(s,i){
    h+='<fieldset class="ecard" style="--c:'+s.color+'"><legend><span class="sw"></span>'+esc(sName(s))+'</legend>'+
      '<div class="frow two"><div><label for="en'+i+'">'+L('English name','الاسم بالإنجليزية')+'</label><input id="en'+i+'" name="name'+i+'" value="'+esc(s.name)+'"></div><div><label for="ea'+i+'">'+L('Arabic name','الاسم بالعربية')+'</label><input id="ea'+i+'" name="ar'+i+'" dir="rtl" value="'+esc(s.ar)+'"></div></div>'+
      '<label for="eo'+i+'">'+L('Old lessons (Sep–Oct)','الدروس القديمة (سبتمبر–أكتوبر)')+'</label><textarea id="eo'+i+'" name="old'+i+'" dir="auto" rows="5">'+esc(s.old.join('\n'))+'</textarea>'+
      '<label for="ew'+i+'">'+L('New lessons','الدروس الجديدة')+'</label><textarea id="ew'+i+'" name="new'+i+'" dir="auto" rows="4">'+esc(s.new.join('\n'))+'</textarea></fieldset>';
  });
  h+='</div><div class="frow btns sticky"><button class="b ok" type="submit">'+L('Save lessons &amp; re-plan','حفظ الدروس وإعادة التوزيع')+'</button><span class="hint" id="editmsg"></span></div></form></section>';
  return h;
}

/* ---------- events ---------- */
root.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a'),id=b.getAttribute('data-id'),t=id&&byId(id);
  if(a==='lang'){setLang(b.getAttribute('data-l'));drawTimer();return;}
  if(a==='timer'&&t){startTimer(t);render();return;}
  if(a==='msg'){msgOpen=true;try{localStorage.setItem('ghada-msg-seen',msgKey());}catch(e2){}render();var c=root.querySelector('.mo button');if(c)c.focus();return;}
  if(a==='msgclose'){msgOpen=false;render();return;}
  if(a==='done'&&t){t.status='done';t.doneAt=today();openForm=null;save();render();}
  else if(a==='form'&&t){openForm=openForm===id?null:id;render();var f=root.querySelector('form.nd input[name=r]');if(f)f.focus();}
  else if(a==='close'){openForm=null;render();}
  else if(a==='undo'&&t){t.status='pending';delete t.reason;delete t.note;delete t.makeupDate;delete t.makeupTime;save();render();}
  else if(a==='madeup'&&t){t.status='madeup';t.doneAt=today();save();render();}
  else if(a==='day'){setSel(b.getAttribute('data-d'));openForm=null;render();}
  else if(a==='open'){setSel(b.getAttribute('data-d'));location.hash='today';}
});
root.addEventListener('change',function(e){
  if(e.target.id==='jump'&&e.target.value){setSel(e.target.value<START?START:e.target.value>LAST?LAST:e.target.value);render();}
  var mi=e.target.getAttribute('data-memo');
  if(mi!=null){state.memo[+mi].text=e.target.value;save();}
});
root.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target;
  if(f.classList.contains('nd')){
    var t=byId(f.getAttribute('data-id')),r=f.querySelector('input[name=r]:checked');
    if(!r){var lg=f.querySelector('legend');lg.textContent=L('Pick a reason first','اختاري السبب أولًا');lg.classList.add('err');return;}
    t.status='missed';t.reason=r.value;t.note=f.note.value.trim();t.makeupDate=f.md.value||'';t.makeupTime=f.mt.value.trim();
    openForm=null;save();render();
  } else if(f.id==='edit'){
    state.student=f.stu.value.trim()||state.student;
    state.subjects.forEach(function(s,i){
      s.name=f['name'+i].value.trim()||s.name;s.ar=f['ar'+i].value.trim();
      s.old=f['old'+i].value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
      s.new=f['new'+i].value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
    });
    var from=add(today(),1);if(from<START)from=START;
    buildPlan(state,from);save();render();var m=document.getElementById('editmsg');if(m)m.textContent=L('Saved. Sessions from '+nice(from)+' were re-planned.','تم الحفظ. أُعيد توزيع الجلسات بدءًا من '+nice(from)+'.');
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&msgOpen){msgOpen=false;render();}});
window.addEventListener('hashchange',function(){openForm=null;render();window.scrollTo(0,0);});
/* ---------- session timer ---------- */
function drawTimer(){
  if(!tState){bar.className='';bar.innerHTML='';return;}
  var t=byId(tState.id);if(!t){tSet(null);bar.className='';bar.innerHTML='';return;}
  var ms=leftMs(),fin=ms<=0,paused=tState.left!=null&&!fin,p=Math.min(100,Math.max(0,100-Math.round(100*ms/tState.total)));
  if(fin&&!tState.done){tState.done=true;tSet(tState);beep();try{if(navigator.vibrate)navigator.vibrate([300,150,300]);}catch(e){}}
  bar.className='on'+(fin?' fin':'');
  bar.style.setProperty('--c',subj(t.subj).color);
  bar.innerHTML='<div class="tb-prog" style="width:'+p+'%"></div><div class="tb-in"><div class="tb-info"><span class="tb-s">⏱ '+esc(sName(subj(t.subj)))+' · '+kindLabel(t.kind)+'</span><span class="tb-t" dir="auto">'+esc(title(t))+'</span></div><div class="tb-clock">'+(fin?L('Time’s up!','انتهى الوقت!'):fmt(ms))+'</div><div class="tb-act">'+
    (fin?'<span class="tb-msg">'+L('Great work. Take a 10-minute break.','أحسنتِ! خذي استراحة 10 دقائق.')+'</span><button class="b ok" data-t="done">✓ '+L('Mark done','تم الإنجاز')+'</button>':
    '<button class="b ghost" data-t="minus" aria-label="'+L('5 minutes less','أقل بخمس دقائق')+'">−5</button><button class="b ghost" data-t="plus" aria-label="'+L('5 minutes more','أكثر بخمس دقائق')+'">+5</button><button class="b" data-t="pause">'+(paused?L('Resume','استئناف'):L('Pause','إيقاف مؤقت'))+'</button>')+
    '<button class="b ghost" data-t="stop" aria-label="'+L('Close timer','إغلاق المؤقت')+'">✕</button></div></div>';
}
bar.addEventListener('click',function(e){
  var b=e.target.closest('[data-t]');if(!b||!tState)return;var a=b.getAttribute('data-t');
  if(a==='pause'){if(tState.left!=null){tState.end=Date.now()+tState.left;tState.left=null;}else tState.left=leftMs();tSet(tState);}
  else if(a==='plus'||a==='minus'){var d=(a==='plus'?5:-5)*60000;if(tState.left!=null)tState.left=Math.max(60000,tState.left+d);else tState.end=Math.max(Date.now()+60000,tState.end+d);tState.total=Math.max(60000,tState.total+d);tState.done=false;tSet(tState);}
  else if(a==='stop'){tSet(null);render();}
  else if(a==='done'){var t=byId(tState.id);tSet(null);if(t&&t.status==='pending'){t.status='done';t.doneAt=today();save();}render();}
  drawTimer();
});
setInterval(function(){if(tState&&tState.left==null&&!tState.done)drawTimer();},1000);
applyDir();
render();
drawTimer();
})();
</script>
